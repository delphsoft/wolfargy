        // FUNCIONES HELPER
        function createCard(page, icon, title, stat, desc) {
            return `
                <div onclick="navigateTo('${page}')" 
                     class="bg-white rounded-2xl p-6 shadow-lg hover:shadow-2xl transition-all cursor-pointer hover:-translate-y-2">
                    <div class="text-6xl text-center mb-4">${icon}</div>
                    <h3 class="text-2xl font-bold text-center mb-3">${title}</h3>
                    <div class="text-5xl font-black text-center mb-4 text-blue-600">${stat}</div>
                    <p class="text-gray-600 text-center mb-6">${desc}</p>
                    <button class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">
                        Ver Detalles →
                    </button>
                </div>
            `;
        }

        function createBar(label, value, color) {
            const colors = {
                red: 'bg-red-500',
                blue: 'bg-blue-500',
                green: 'bg-green-500',
                purple: 'bg-purple-500',
                yellow: 'bg-yellow-500',
                orange: 'bg-orange-500'
            };
            const width = Math.abs(value) * 2;
            return `
                <div>
                    <div class="flex justify-between mb-2">
                        <span class="font-semibold">${label}</span>
                        <span class="font-bold text-lg">${value}%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3">
                        <div class="${colors[color]} rounded-full h-3" style="width: ${width}%"></div>
                    </div>
                </div>
            `;
        }

        function createCompanyCard(name, production, share, investment) {
            return `
                <div class="bg-gray-50 rounded-lg p-4">
                    <h4 class="font-bold text-lg mb-2">${name}</h4>
                    <div class="text-sm space-y-1">
                        <p><span class="text-gray-600">Producción:</span> <strong>${production}</strong></p>
                        <p><span class="text-gray-600">Participación:</span> <strong>${share}</strong></p>
                        <p><span class="text-gray-600">Inversión:</span> <strong>${investment}</strong></p>
                    </div>
                </div>
            `;
        }

        function createProjectionCard(name, value) {
            return `
                <div class="bg-purple-50 rounded-lg p-4 text-center">
                    <p class="text-sm font-semibold text-gray-700 mb-2">${name}</p>
                    <p class="text-3xl font-black text-purple-600">${value}</p>
                </div>
            `;
        }

        function createMonthCard(month, value, color) {
            return `
                <div class="bg-${color}-50 rounded-lg p-4 text-center">
                    <p class="text-xs font-bold text-${color}-600 mb-2">${month}</p>
                    <p class="text-2xl font-black text-${color}-600">${value}</p>
                </div>
            `;
        }

        function createInfoCard(title, stat, subtitle, color) {
            return `
                <div class="bg-white rounded-xl p-6 shadow-lg">
                    <h3 class="font-bold text-gray-700 mb-3">${title}</h3>
                    <div class="text-5xl font-black text-${color}-600 mb-2">${stat}</div>
                    <p class="text-sm text-gray-500">${subtitle}</p>
                </div>
            `;
        }

        // NAVEGACIÓN
        function navigateTo(pageName) {
            const page = pages[pageName];
            if (!page) {
                console.error('Página no encontrada:', pageName);
                return;
            }

            document.getElementById('app').innerHTML = `
                <div class="max-w-7xl mx-auto px-4 py-8">
                    <div class="mb-4">
                        <h1 class="text-2xl font-bold text-gray-600">${page.title}</h1>
                    </div>
                    ${page.content}
                </div>
            `;

            window.scrollTo(0, 0);
            console.log('✅ Navegado a:', pageName);
        }
